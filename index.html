<!doctype html>

<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0d">
<title>COME BY</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#09090b;--card:#151519;--soft:#202027;--ink:#fff;--muted:#a1a1aa;--gold:#d7b46a;--line:#2b2b32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.app{max-width:540px;margin:auto;min-height:100vh;background:var(--bg)}
header{position:sticky;top:0;z-index:10;padding:16px 18px;background:#09090dec;border-bottom:1px solid var(--line);backdrop-filter:blur(15px);display:flex;justify-content:space-between}
.brand{font-weight:950;font-size:26px;letter-spacing:-1px}
.gold{color:var(--gold)}
main{padding:18px 16px 90px}
.hero{padding:25px;border:1px solid #353039;border-radius:26px;background:radial-gradient(circle at top right,#40301b,#151519 48%);margin-bottom:15px}
.hero h1{font-size:34px;line-height:1;margin:5px 0 12px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:13px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button,.btn{border:1px solid var(--line);background:#19191f;color:#fff;border-radius:15px;padding:14px;font-weight:850}
.choice button.active{border-color:var(--gold);background:#292216;color:var(--gold)}
.btn{width:100%;background:var(--gold);color:#111;border:0}
.btn.secondary{background:transparent;color:#fff;border:1px solid var(--line)}
label{font-size:12px;font-weight:800;display:block;margin:10px 0 6px}
input,textarea{width:100%;background:#0e0e12;color:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}
textarea{min-height:85px}
.profilepic{width:74px;height:74px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.photos{display:flex;gap:8px;overflow:auto}
.photos img{width:88px;height:88px;object-fit:cover;border-radius:14px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:540px;width:100%;background:#111114;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px}
.nav button{background:none;border:0;color:var(--muted);padding:8px;font-size:11px}
.nav .active{color:var(--gold)}
.tag{font-size:11px;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1}
.pill{display:inline-block;border:1px solid #594a2e;color:var(--gold);padding:5px 8px;border-radius:99px;font-size:11px}
.map{height:290px;border-radius:20px;overflow:hidden}
.auth{min-height:100vh;padding:28px 18px;display:flex;align-items:center}
.authbox{width:100%;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#0e0e12;border-radius:12px;padding:4px;margin:18px 0}
.tabs button{border:0;background:none;color:var(--muted);padding:10px;border-radius:9px;font-weight:800}
.tabs .active{background:#24242b;color:#fff}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:11px 15px;border-radius:12px;display:none;z-index:30}
.toast.show{display:block}
.msg{padding:10px 13px;border-radius:15px;background:#202027;margin:7px 0;max-width:82%}
.mine{margin-left:auto;background:#3b3221;color:#fff}
.hidden{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const A='/api';
let S={
 user:null,
 screen:'home',
 requests:[],
 chats:[],
 selected:null,
 auth:'login',
 role:'client',
 assistance:'SHORT TIME',
 transport:'PICK & DROP',
 map:null
};

const $=id=>document.getElementById(id);

async function api(p,o={}){
 o.headers={
  'Content-Type':'application/json',
  ...(o.headers||{}),
  ...(localStorage.cb_token?{Authorization:'Bearer '+localStorage.cb_token}:{})
 };
 let r=await fetch(A+p,o),d=await r.json();
 if(!r.ok)throw Error(d.error||'Request failed');
 return d
}

function toast(x){
 $('toast').textContent=x;
 $('toast').classList.add('show');
 setTimeout(()=>$('toast').classList.remove('show'),2200)
}

async function boot(){
 if(localStorage.cb_token)
  try{
   S.user=(await api('/auth/me')).user
  }catch(e){
   localStorage.removeItem('cb_token')
  }
 render()
}

function nav(){
 return S.user?`
 <div class="nav">
  <button onclick="go('home')" class="${S.screen==='home'?'active':''}">⌂<br>Home</button>
  <button onclick="go('requests')" class="${S.screen==='requests'?'active':''}">◉<br>Requests</button>
  <button onclick="go('map')" class="${S.screen==='map'?'active':''}">⌖<br>Map</button>
  <button onclick="go('profile')" class="${S.screen==='profile'?'active':''}">●<br>Profile</button>
 </div>`:''
}

function head(){
 return `
 <header>
  <div>
   <div class="brand">COME <span class="gold">BY</span></div>
   <div class="tag">PRIVATE PERSONAL ASSISTANCE</div>
  </div>
  <span class="pill">${S.user?.role?.toUpperCase()||''}</span>
 </header>`
}

function go(x){
 S.screen=x;
 render()
}

function auth(){
 return `
 <div class="auth">
  <div class="authbox">
   <div class="brand">COME <span class="gold">BY</span></div>
   <p class="muted">Connect. Choose. Meet.</p>

   <div class="tabs">
    <button class="${S.auth==='login'?'active':''}" onclick="S.auth='login';render()">Log in</button>
    <button class="${S.auth==='signup'?'active':''}" onclick="S.auth='signup';render()">Sign up</button>
   </div>

   ${S.auth==='signup'?'<label>Full name</label><input id="name" placeholder="Your name">':''}

   <label>Phone</label>
   <input id="phone" placeholder="+267 ...">

   <label>Password</label>
   <input id="pass" type="password" placeholder="At least 6 characters">

   ${S.auth==='signup'?`
   <label>Join as</label>
   <div class="choice">
    <button class="${S.role==='client'?'active':''}" onclick="S.role='client';render()">Client</button>
    <button class="${S.role==='provider'?'active':''}" onclick="S.role='provider';render()">Provider</button>
   </div>`:''}

   <br>
   <button class="btn" onclick="submitAuth()">
    ${S.auth==='login'?'Log in':'Create account'}
   </button>

   <p class="muted" style="font-size:12px">
    Lawful, non-sexual personal assistance. Exact locations are shared only with consent.
   </p>
  </div>
 </div>`
}

async function submitAuth(){
 try{
  let body={
   phone:$('phone').value,
   password:$('pass').value
  };

  if(S.auth==='signup')
   Object.assign(body,{
    name:$('name').value,
    role:S.role
   });

  let d=await api(
   '/auth/'+(S.auth==='login'?'login':'register'),
   {
    method:'POST',
    body:JSON.stringify(body)
   }
  );

  localStorage.cb_token=d.token;
  S.user=d.user;
  render()
 }catch(e){
  toast(e.message)
 }
}

function home(){
 if(S.user.role==='client')
 return `
 <div class="hero">
  <span class="pill">PERSONAL ASSISTANCE</span>
  <h1>
   Find the right person.<br>
   <span class="gold">Choose with confidence.</span>
  </h1>
  <p class="muted">
   Post what you need, review interested providers and connect privately after acceptance.
  </p>
 </div>

 <div class="card">
  <h3>Start a request</h3>

  <label>Choose duration</label>
  <div class="choice">
   <button class="${S.assistance==='SHORT TIME'?'active':''}"
    onclick="S.assistance='SHORT TIME';render()">SHORT TIME</button>

   <button class="${S.assistance==='SLEEP OVER'?'active':''}"
    onclick="S.assistance='SLEEP OVER';render()">SLEEP OVER</button>
  </div>

  <label>Choose movement</label>
  <div class="choice">
   <button class="${S.transport==='PICK & DROP'?'active':''}"
    onclick="S.transport='PICK & DROP';render()">PICK & DROP</button>

   <button class="${S.transport==='DRIVE THROUGH'?'active':''}"
    onclick="S.transport='DRIVE THROUGH';render()">DRIVE THROUGH</button>
  </div>

  <label>Area / meeting point</label>
  <input id="area" placeholder="e.g. CBD, Gaborone">

  <label>Proposed amount (optional)</label>
  <input id="amount" type="number" placeholder="P">

  <label>Details</label>
  <textarea id="details" placeholder="Describe the assistance you need"></textarea>  <br>
  <button class="btn" onclick="createReq()">POST REQUEST</button>
 </div>`;return `

 <div class="hero">
  <span class="pill">PROVIDER</span>
  <h1>
   Be visible.<br>
   <span class="gold">Choose your requests.</span>
  </h1>
  <p class="muted">
   Complete your profile with age and up to 3 photos, then show interest in suitable requests.
  </p>
 </div> <div class="card">
  <h3>Open requests</h3>
  <div id="providerList">Loading…</div>
 </div>`
}async function createReq(){
try{
let d=await api('/requests',{
method:'POST',
body:JSON.stringify({
assistance_type:S.assistance,
transport_type:S.transport,
area:$('area').value,
amount:$('amount').value,
details:$('details').value
})
});

toast('Request posted');
go('requests')
}catch(e){
toast(e.message)
}
}

async function requests(){
let d=await api('/requests');
S.requests=d.requests;

return `

 <div class="card">
  <h2>${S.user.role==='client'?'Your requests':'Available requests'}</h2>${S.requests.length?
S.requests.map(r=>`
<div class="card">
<span class="pill">${r.assistance_type}</span>
<span class="pill">${r.transport_type}</span>

 <h3>${r.area}</h3>

 <p class="muted">
  ${r.details||'No extra details'}
 </p>

 <p>
  ${r.amount?'P'+r.amount:'Amount to discuss'}
 </p>

 ${S.user.role==='provider'?
  `<button class="btn" onclick="interest(${r.id})">
   I'M INTERESTED
  </button>`
  :
  `<button class="btn secondary" onclick="providers(${r.id})">
   VIEW INTERESTED PROVIDERS
  </button>`
 }
</div>

`).join('')
:
'<div class="muted">No requests yet.</div>'
}

 </div>`
}async function interest(id){
try{
await api('/requests/'+id+'/interests',{
method:'POST'
});
toast('Interest sent')
}catch(e){
toast(e.message)
}
}

async function providers(id){
try{
let d=await api('/requests/'+id+'/providers');
S.selected=id;
go('providers');
S.providers=d.providers;
render()
}catch(e){
toast(e.message)
}
}

function providerScreen(){
return `

 <div class="card">
  <button class="btn secondary" onclick="go('requests')">← Back</button>  <h2>Interested providers</h2>${(S.providers||[]).map(p=>`

   <div class="card"><div class="row">
 ${p.photos?.[0]?
  `<img class="profilepic" src="${p.photos[0]}">`
  :
  '<div class="profilepic" style="display:grid;place-items:center">●</div>'
 }

 <div class="grow">
  <h3>${p.name}</h3>
  <div class="muted">${p.age||'Age not added'}</div>
 </div>
</div>

${p.photos?.length?
 `<div class="photos">
  ${p.photos.map(x=>`<img src="${x}">`).join('')}
 </div>`
 :''
}

<br>

<button class="btn"
 onclick="accept(${S.selected},${p.id})">
 ACCEPT PROVIDER
</button>

   </div>
  `).join('')||'<p class="muted">No providers yet.</p>'}
 </div>`
}async function accept(r,p){
try{
await api('/requests/'+r+'/accept',{
method:'POST',
body:JSON.stringify({
provider_id:p
})
});

toast('Accepted — private chat is now open');
go('chats')
}catch(e){
toast(e.message)
}
}

async function chats(){
let d=await api('/chats');
S.chats=d.chats;

return `

 <div class="card">
  <h2>Private messages</h2>${S.chats.length?
S.chats.map(c=>`
<div class="card">
<h3>
${S.user.id===c.client_id?c.provider_name:c.client_name}
</h3>

 <p class="muted">
  ${c.assistance_type} · ${c.transport_type}
 </p>

 <button class="btn"
  onclick="openChat(${c.request_id})">
  OPEN CHAT
 </button>
</div>

`).join('')
:
'<p class="muted">Chats appear here after a client accepts a provider.</p>'
}

 </div>`
}async function openChat(id){
let d=await api('/chats/'+id+'/messages');
S.selected=id;
S.messages=d.messages;
S.screen='chat';
render()
}

async function sendMsg(){
try{
await api('/chats/'+S.selected+'/messages',{
method:'POST',
body:JSON.stringify({
body:$('msg').value
})
});

openChat(S.selected)
}catch(e){
toast(e.message)
}
}

function chat(){
return `

 <div class="card">  <button class="btn secondary" onclick="go('chats')">
   ← Back
  </button>  <h2>Private chat</h2>${(S.messages||[]).map(m=>`

   <div class="msg ${m.sender_id===S.user.id?'mine':''}">
    ${m.body}
    <div class="muted" style="font-size:10px">
     ${new Date(m.created_at).toLocaleString()}
    </div>
   </div>
  `).join('')}<label>Message</label>
<input id="msg" placeholder="Type privately…">

  <br><button class="btn" onclick="sendMsg()">SEND</button>

 </div>`
}function profile(){
let u=S.user;

return `

 <div class="card">
  <h2>My profile</h2>  <div class="row">
   <div class="profilepic" style="display:grid;place-items:center">
    ${u.name?.[0]||'C'}
   </div>   <div>
    <h3>${u.name}</h3>
    <div class="muted">${u.phone}</div>
   </div>
  </div><label>Age</label>
<input id="age" type="number"
value="${u.age||''}"
placeholder="18+">

  <br>  <button class="btn" onclick="saveAge()">
   SAVE PROFILE
  </button>${u.role==='provider'?
`

   <div class="card">
    <h3>Profile photos</h3><p class="muted">
 Upload up to 3 JPG, PNG or WEBP photos.
</p>

<input id="photos"
 type="file"
 accept="image/jpeg,image/png,image/webp"
 multiple>

<br><br>

<button class="btn" onclick="uploadPhotos()">
 UPLOAD PHOTOS
</button>

${u.photos?.length?
 `
 <div class="photos" style="margin-top:12px">
  ${u.photos.map(x=>`<img src="${x}">`).join('')}
 </div>
 `
 :''
}

   </div>
   `
   :''
  }  <br><button class="btn secondary"
onclick="localStorage.removeItem('cb_token');location.reload()">
LOG OUT
</button>

 </div>`
}async function saveAge(){
try{
S.user=(await api('/profile',{
method:'PUT',
body:JSON.stringify({
age:Number($('age').value)
})
})).user;

toast('Profile saved')
}catch(e){
toast(e.message)
}
}

async function uploadPhotos(){
try{
let f=$('photos').files;

if(f.length<1||f.length>3)
return toast('Choose 1 to 3 photos');

let fd=new FormData();

[...f].forEach(x=>fd.append('photos',x));

let r=await fetch(A+'/profile/photos',{
method:'POST',
headers:{
Authorization:'Bearer '+localStorage.cb_token
},
body:fd
});

let d=await r.json();

if(!r.ok)throw Error(d.error);

S.user=d.user;

toast('Photos uploaded');
render()
}catch(e){
toast(e.message)
}
}

function map(){
setTimeout(()=>{
if(S.map)return;

S.map=L.map('map').setView(
[-24.6282,25.9231],
13
);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(S.map);

navigator.geolocation?.getCurrentPosition(
p=>{
let a=[
p.coords.latitude,
p.coords.longitude
];

S.map.setView(a,15);

L.marker(a)
 .addTo(S.map)
 .bindPopup(
  'Your location — visible only on your device until you choose to share it.'
 )
 .openPopup()

}
)
},50);

return `

 <div class="card">
  <h2>Live location</h2>  <p class="muted">
   Real GPS map. Location sharing is consent-based and should only be shared with the person you accepted.
  </p>  <div id="map" class="map"></div>
 </div>`
}async function render(){
if(!S.user){
$('app').innerHTML=auth();
return
}

S.map=null;

let body=
S.screen==='home'?home():
S.screen==='requests'?await requests():
S.screen==='providers'?providerScreen():
S.screen==='chats'?await chats():
S.screen==='chat'?chat():
S.screen==='profile'?profile():
S.screen==='map'?map():
home();

$('app').innerHTML=
head()+
'<main>'+body+'</main>'+
nav();

if(
S.user.role==='provider'&&
S.screen==='home'
){
try{
let d=await api('/requests');

$('providerList').innerHTML=
d.requests.length?
d.requests.slice(0,5).map(r=>`
<div class="card">
<span class="pill">${r.assistance_type}</span>
<span class="pill">${r.transport_type}</span>

   <h3>${r.area}</h3>

   <p class="muted">
    ${r.details||''}
   </p>

   <button class="btn"
    onclick="interest(${r.id})">
    I'M INTERESTED
   </button>
  </div>
 `).join('')
 :
 'No open requests.';

}catch(e){}
}
}

boot();
</script>

</body>
  </html>
