<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>COME BY · #TlaKwana</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    :root{
      --bg:#09090b;
      --card:#151519;
      --soft:#202027;
      --ink:#fff;
      --muted:#a1a1aa;
      --gold:#d7b46a;
      --line:#2b2b32;
      --green:#58d68d;
      --red:#ff7272;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .app{
      max-width:560px;
      margin:auto;
      min-height:100vh;
      background:var(--bg);
    }

    header{
      position:sticky;
      top:0;
      z-index:20;
      padding:14px 17px;
      background:#09090dec;
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(15px);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .brand{
      font-weight:950;
      font-size:25px;
      letter-spacing:-1px;
    }

    .slogan{
      font-size:12px;
      color:var(--gold);
      font-weight:900;
      letter-spacing:.5px;
    }

    .tag{
      font-size:10px;
      color:var(--muted);
      letter-spacing:.5px;
      margin-top:2px;
    }

    main{
      padding:17px 15px 90px;
    }

    .hero{
      padding:23px;
      border:1px solid #353039;
      border-radius:25px;
      background:
        radial-gradient(
          circle at top right,
          #40301b,
          #151519 48%
        );
      margin-bottom:14px;
    }

    .hero h1{
      font-size:32px;
      line-height:1;
      margin:7px 0 12px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:19px;
      padding:16px;
      margin-bottom:12px;
    }

    .card h2,
    .card h3{
      margin-top:0;
    }

    .tight{
      padding:12px;
    }

    .muted{
      color:var(--muted);
    }

    .gold{
      color:var(--gold);
    }

    .green{
      color:var(--green);
    }

    .red{
      color:var(--red);
    }

    .small{
      font-size:12px;
    }

    .big{
      font-size:22px;
      font-weight:900;
    }

    .row{
      display:flex;
      gap:11px;
      align-items:center;
    }

    .grow{
      flex:1;
    }

    .choice{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
    }

    .choice button{
      border:1px solid var(--line);
      background:#19191f;
      color:#fff;
      border-radius:14px;
      padding:13px;
      font-weight:850;
    }

    .choice button.active{
      border-color:var(--gold);
      background:#292216;
      color:var(--gold);
    }

    .btn{
      width:100%;
      border:0;
      border-radius:14px;
      padding:13px;
      font-weight:850;
      background:var(--gold);
      color:#111;
    }

    .btn.secondary{
      background:transparent;
      color:#fff;
      border:1px solid var(--line);
    }

    .btn.green{
      background:var(--green);
      color:#111;
    }

    .btn.danger{
      background:var(--red);
      color:#111;
    }

    .btn.small-btn{
      width:auto;
      padding:9px 12px;
      font-size:11px;
    }

    label{
      font-size:12px;
      font-weight:800;
      display:block;
      margin:11px 0 6px;
    }

    input,
    textarea,
    select{
      width:100%;
      background:#0e0e12;
      color:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      outline:none;
    }

    input:focus,
    textarea:focus,
    select:focus{
      border-color:var(--gold);
    }

    textarea{
      min-height:82px;
      resize:vertical;
    }

    .pill{
      display:inline-block;
      border:1px solid #594a2e;
      color:var(--gold);
      padding:5px 8px;
      border-radius:99px;
      font-size:10px;
      font-weight:800;
      margin:2px;
    }

    .status{
      font-size:11px;
      font-weight:900;
    }

    .available{
      color:var(--green);
    }

    .offline{
      color:var(--muted);
    }

    .phone{
      font-size:14px;
      font-weight:900;
      color:var(--gold);
    }

    .photos{
      display:flex;
      gap:7px;
      overflow:auto;
      margin-top:9px;
    }

    .photos img{
      width:84px;
      height:84px;
      object-fit:cover;
      border-radius:13px;
      border:1px solid var(--line);
      flex:0 0 auto;
    }

    .profilepic{
      width:68px;
      height:68px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid var(--gold);
      flex:0 0 auto;
    }

    .map{
      height:390px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid var(--line);
    }

    .mapnote{
      padding:10px 11px;
      background:#101014;
      border-radius:12px;
      margin-bottom:9px;
      font-size:11px;
      color:var(--muted);
    }

    .locdot{
      color:var(--green);
      font-size:11px;
      font-weight:800;
    }

    .line{
      height:1px;
      background:var(--line);
      margin:13px 0;
    }

    .request-card{
      border-left:3px solid var(--gold);
    }

    .provider-card{
      border-left:3px solid var(--green);
    }

    .empty{
      text-align:center;
      padding:30px 10px;
      color:var(--muted);
    }

    .nav{
      position:fixed;
      bottom:0;
      left:50%;
      transform:translateX(-50%);
      max-width:560px;
      width:100%;
      background:#111114;
      border-top:1px solid var(--line);
      display:grid;
      grid-template-columns:repeat(5,1fr);
      padding:6px 5px;
      z-index:25;
    }

    .nav button{
      background:none;
      border:0;
      color:var(--muted);
      padding:7px 2px;
      font-size:10px;
    }

    .nav .active{
      color:var(--gold);
    }

    .auth{
      min-height:100vh;
      padding:25px 17px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .authbox{
      width:100%;
      max-width:430px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      padding:22px;
    }

    .authbox .brand{
      font-size:32px;
    }

    .tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      background:#0e0e12;
      border-radius:11px;
      padding:4px;
      margin:17px 0;
    }

    .tabs button{
      border:0;
      background:none;
      color:var(--muted);
      padding:10px;
      border-radius:8px;
      font-weight:800;
    }

    .tabs .active{
      background:#24242b;
      color:#fff;
    }

    .toast{
      position:fixed;
      bottom:77px;
      left:50%;
      transform:translateX(-50%);
      background:#fff;
      color:#111;
      padding:11px 15px;
      border-radius:12px;
      display:none;
      z-index:50;
      max-width:90%;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
    }

    .toast.show{
      display:block;
    }

    .msg{
      padding:10px 13px;
      border-radius:15px;
      background:#202027;
      margin:7px 0;
      max-width:82%;
      word-break:break-word;
    }

    .msg.mine{
      margin-left:auto;
      background:#3b3221;
    }

    .toggle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .switch{
      width:52px;
      height:30px;
      border-radius:99px;
      background:#333;
      position:relative;
      border:0;
      flex:0 0 auto;
    }

    .switch i{
      position:absolute;
      top:4px;
      left:4px;
      width:22px;
      height:22px;
      border-radius:50%;
      background:#fff;
      transition:.2s;
    }

    .switch.on{
      background:var(--green);
    }

    .switch.on i{
      left:26px;
    }

    @media(max-width:480px){
      .hero h1{
        font-size:28px;
      }

      .choice{
        grid-template-columns:1fr;
      }

      .map{
        height:350px;
      }
    }
  </style>
</head>

<body>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "/api";

let token =
  localStorage.getItem("cb_token") || "";

let currentUser = null;

let currentScreen = "home";

let selectedRequestId = null;

let liveMap = null;

let livePollTimer = null;

let locationWatchId = null;

let locationSharing = false;

let messages = [];


// ======================================
// HELPERS
// ======================================

function $(id){
  return document.getElementById(id);
}

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(message){

  const el = $("toast");

  el.textContent = message;

  el.classList.add("show");

  setTimeout(() => {
    el.classList.remove("show");
  }, 2500);
}

async function api(path, options = {}){

  const headers = {
    ...(options.headers || {})
  };

  if(
    options.body &&
    typeof options.body !== "string"
  ){

    headers["Content-Type"] =
      "application/json";

    options.body =
      JSON.stringify(options.body);
  }

  if(token){

    headers.Authorization =
      "Bearer " + token;
  }

  const response =
    await fetch(API + path,{
      ...options,
      headers
    });

  let data = {};

  try{
    data = await response.json();
  }catch(_){}

  if(!response.ok){

    throw new Error(
      data.error ||
      "Request failed."
    );
  }

  return data;
}


// ======================================
// BOOT
// ======================================

async function boot(){

  if(!token){

    render();

    return;
  }

  try{

    const data =
      await api("/auth/me");

    currentUser =
      data.user;

  }catch(error){

    token = "";

    currentUser = null;

    localStorage.removeItem(
      "cb_token"
    );
  }

  render();
}


// ======================================
// LOGOUT
// ======================================

function logout(){

  stopLocationWatch();

  stopLivePolling();

  token = "";

  currentUser = null;

  localStorage.removeItem(
    "cb_token"
  );

  currentScreen = "home";

  render();
}


// ======================================
// AUTH
// ======================================

let authMode = "login";

let authRole = "client";

function renderAuth(){

  $("app").innerHTML = `

    <div class="auth">

      <div class="authbox">

        <div class="brand">
          COME <span class="gold">BY</span>
        </div>

        <div class="slogan">
          #TlaKwana
        </div>

        <p class="muted">
          Connect. Choose. Meet.
        </p>

        <div class="tabs">

          <button
            class="${authMode==="login"?"active":""}"
            onclick="authMode='login';render()"
          >
            LOG IN
          </button>

          <button
            class="${authMode==="signup"?"active":""}"
            onclick="authMode='signup';render()"
          >
            SIGN UP
          </button>

        </div>

        ${
          authMode === "signup"
          ? `
            <label>Full name</label>

            <input
              id="auth-name"
              placeholder="Your name"
            >

            <label>Age</label>

            <input
              id="auth-age"
              type="number"
              min="18"
              max="100"
              placeholder="18+"
            >

            <label>Join as</label>

            <div class="choice">

              <button
                class="${authRole==="client"?"active":""}"
                onclick="authRole='client';render()"
              >
                CLIENT
              </button>

              <button
                class="${authRole==="provider"?"active":""}"
                onclick="authRole='provider';render()"
              >
                PROVIDER
              </button>

            </div>
          `
          : ""
        }

        <label>Phone number</label>

        <input
          id="auth-phone"
          type="tel"
          placeholder="+267 ..."
        >

        <label>Password</label>

        <input
          id="auth-password"
          type="password"
          placeholder="Password"
        >

        <br>

        <button
          class="btn"
          onclick="submitAuth()"
        >
          ${
            authMode === "login"
              ? "LOG IN"
              : "CREATE ACCOUNT"
          }
        </button>

        <div class="mapnote" style="margin-top:14px">

          COME BY is designed for
          <strong>lawful, non-sexual personal assistance.</strong>

          Live location is shared only for
          relevant requests.

        </div>

      </div>

    </div>
  `;
}

async function submitAuth(){

  try{

    const phone =
      $("auth-phone")
        .value
        .trim();

    const password =
      $("auth-password")
        .value;

    if(!phone || !password){

      throw new Error(
        "Phone number and password are required."
      );
    }

    let body = {
      phone,
      password
    };

    let endpoint =
      "/auth/login";

    if(authMode === "signup"){

      const name =
        $("auth-name")
          .value
          .trim();

      const age =
        Number(
          $("auth-age")
            .value
        );

      if(!name){

        throw new Error(
          "Please enter your name."
        );
      }

      if(!age || age < 18){

        throw new Error(
          "You must be 18 or older."
        );
      }

      body = {
        name,
        phone,
        age,
        role:authRole,
        password
      };

      endpoint =
        "/auth/register";
    }

    const data =
      await api(
        endpoint,
        {
          method:"POST",
          body
        }
      );

    token =
      data.token;

    localStorage.setItem(
      "cb_token",
      token
    );

    currentUser =
      data.user;

    currentScreen =
      "home";

    render();

  }catch(error){

    toast(error.message);
  }
}


// ======================================
// HEADER
// ======================================

function head(){

  return `

    <header>

      <div>

        <div class="brand">
          COME <span class="gold">BY</span>
        </div>

        <div class="slogan">
          #TlaKwana
        </div>

        <div class="tag">
          PRIVATE PERSONAL ASSISTANCE
        </div>

      </div>

      <span class="pill">
        ${esc(currentUser?.role || "")}
      </span>

    </header>
  `;
}


// ======================================
// NAVIGATION
// ======================================

function nav(){

  return `

    <div class="nav">

      <button
        onclick="go('home')"
        class="${currentScreen==="home"?"active":""}"
      >
        ⌂<br>
        HOME
      </button>

      <button
        onclick="go('requests')"
        class="${currentScreen==="requests"?"active":""}"
      >
        ◉<br>
        REQUESTS
      </button>

      <button
        onclick="go('history')"
        class="${currentScreen==="history"?"active":""}"
      >
        ▣<br>
        HISTORY
      </button>

      <button
        onclick="go('map')"
        class="${currentScreen==="map"?"active":""}"
      >
        ⌖<br>
        LIVE MAP
      </button>

      <button
        onclick="go('profile')"
        class="${currentScreen==="profile"?"active":""}"
      >
        ●<br>
        PROFILE
      </button>

    </div>
  `;
}

function go(screen){

  stopLivePolling();

  currentScreen =
    screen;

  render();
}


// ======================================
// MAIN RENDER
// ======================================

async function render(){

  if(!currentUser){

    renderAuth();

    return;
  }

  let content = "";

  try{

    if(currentScreen === "home"){

      content =
        await home();
    }

    else if(currentScreen === "requests"){

      content =
        await requests();
    }

    else if(currentScreen === "history"){

      content =
        await historyScreen();
    }

    else if(currentScreen === "map"){

      content =
        mapScreen();
    }

    else if(currentScreen === "profile"){

      content =
        profileScreen();
    }

    else if(currentScreen === "providers"){

      content =
        await providersScreen();
    }

    else if(currentScreen === "match"){

      content =
        await matchScreen();
    }

    else if(currentScreen === "chat"){

      content =
        chatScreen();
    }

    else if(currentScreen === "chatlist"){

      content =
        await chatListScreen();
    }

    else{

      content =
        await home();
    }

  }catch(error){

    content = `

      <div class="card">

        <div class="red">
          ${esc(error.message)}
        </div>

        <br>

        <button
          class="btn"
          onclick="go('home')"
        >
          HOME
        </button>

      </div>
    `;
  }

  $("app").innerHTML =
    `<div class="app">
      ${head()}
      <main>${content}</main>
      ${nav()}
    </div>`;

  if(
    currentScreen === "home" &&
    currentUser.role === "client"
  ){

    loadAvailableProviders();
  }

  if(
    currentScreen === "map" &&
    currentUser.role === "client" &&
    selectedRequestId
  ){

    setTimeout(
      () => initLiveMap(
        selectedRequestId
      ),
      100
    );
  }
}


// ======================================
// CLIENT HOME
// ======================================

let selectedAssistance =
  "SHORT TIME";

let selectedTransport =
  "PICK & DROP";

async function home(){

  if(currentUser.role === "provider"){

    return providerHome();
  }

  return `

    <div class="hero">

      <span class="pill">
        CLIENT
      </span>

      <h1>
        Find the right person.
        <br>
        <span class="gold">
          Choose with confidence.
        </span>
      </h1>

      <p class="muted">
        Post a request, see interested
        providers and view their live
        locations on your map.
      </p>

    </div>

    <div class="card">

      <h3>
        Start a request
      </h3>

      <label>
        Assistance type
      </label>

      <div class="choice">

        <button
          class="${selectedAssistance==="SHORT TIME"?"active":""}"
          onclick="selectedAssistance='SHORT TIME';render()"
        >
          SHORT TIME
        </button>

        <button
          class="${selectedAssistance==="SLEEP OVER"?"active":""}"
          onclick="selectedAssistance='SLEEP OVER';render()"
        >
          SLEEP OVER
        </button>

      </div>

      <label>
        Transport / movement
      </label>

      <div class="choice">

        <button
          class="${selectedTransport==="PICK & DROP"?"active":""}"
          onclick="selectedTransport='PICK & DROP';render()"
        >
          PICK & DROP
        </button>

        <button
          class="${selectedTransport==="DRIVE THROUGH"?"active":""}"
          onclick="selectedTransport='DRIVE THROUGH';render()"
        >
          DRIVE THROUGH
        </button>

      </div>

      <label>
        Area / meeting point
      </label>

      <input
        id="request-area"
        placeholder="e.g. CBD, Gaborone"
      >

      <label>
        Proposed amount (optional)
      </label>

      <input
        id="request-amount"
        type="number"
        min="0"
        placeholder="P"
      >

      <label>
        Details
      </label>

      <textarea
        id="request-details"
        placeholder="Describe the assistance you need"
      ></textarea>

      <br>

      <button
        class="btn"
        onclick="createRequest()"
      >
        POST REQUEST
      </button>

    </div>

    <div class="card">

      <div class="row">

        <div class="grow">

          <h3 style="margin:0">
            Available providers
          </h3>

          <div class="muted small">
            Providers who have chosen to
            be available.
          </div>

        </div>

        <button
          class="btn secondary small-btn"
          onclick="loadAvailableProviders()"
        >
          REFRESH
        </button>

      </div>

      <div
        id="available-providers"
        class="small muted"
        style="margin-top:12px"
      >
        Loading...
      </div>

    </div>
  `;
}


// ======================================
// CREATE REQUEST
// ======================================

async function createRequest(){

  try{

    const area =
      $("request-area")
        .value
        .trim();

    const amount =
      $("request-amount")
        .value;

    const details =
      $("request-details")
        .value
        .trim();

    if(!area){

      throw new Error(
        "Please enter the area or meeting point."
      );
    }

    let latitude = null;
    let longitude = null;

    try{

      const position =
        await getCurrentPosition();

      latitude =
        position.coords.latitude;

      longitude =
        position.coords.longitude;

    }catch(_){}

    const data =
      await api(
        "/requests",
        {
          method:"POST",
          body:{
            assistance_type:
              selectedAssistance,

            transport_type:
              selectedTransport,

            area,

            amount:
              amount
                ? Number(amount)
                : null,

            details,

            latitude,
            longitude
          }
        }
      );

    selectedRequestId =
      data.request?.id ||
      data.id ||
      null;

    toast(
      "Request posted successfully."
    );

    go("requests");

  }catch(error){

    toast(error.message);
  }
}


// ======================================
// AVAILABLE PROVIDERS
// ======================================

async function loadAvailableProviders(){

  const el =
    $("available-providers");

  if(!el){
    return;
  }

  try{

    const data =
      await api(
        "/providers/available"
      );

    const providers =
      data.providers || [];

    if(!providers.length){

      el.innerHTML =
        `<div class="empty">
          No providers are currently available.
        </div>`;

      return;
    }

    el.innerHTML =
      providers
        .map(p => `

          <div class="card tight">

            <div class="row">

              ${
                p.photos?.[0]
                ? `
                  <img
                    class="profilepic"

function initLiveMap(
  requestId
){

  const el =
    $("liveMap");

  if(!el){
    return;
  }

  stopLivePolling();

  if(liveMap){

    liveMap.remove();

    liveMap =
      null;
  }

  liveMap =
    L.map(el)
      .setView(
        [-24.6282,25.9231],
        12
      );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:
        "© OpenStreetMap"
    }
  ).addTo(liveMap);

  refreshLiveLocations(
    requestId
  );

  livePollTimer =
    setInterval(
      () =>
        refreshLiveLocations(
          requestId
        ),
      3000
    );
}

function stopLivePolling(){

  if(livePollTimer){

    clearInterval(
      livePollTimer
    );

    livePollTimer =
      null;
  }
}

async function refreshLiveLocations(
  requestId
){

  try{

    const data =
      await api(
        `/requests/${requestId}/live-locations`
      );

    const locations =
      data.locations || [];

    if(!liveMap){
      return;
    }

    liveMap.eachLayer(
      layer => {

        if(
          layer instanceof L.Marker
        ){

          layer.remove();
        }
      }
    );

    const bounds = [];

    locations.forEach(
      provider => {

        const marker =
          L.marker([
            provider.lat,
            provider.lng
          ])
          .addTo(liveMap);

        marker.bindPopup(`

          <strong>
            ${esc(provider.name)}
          </strong>

          <br>

          ${
            provider.age
            ? "Age: " +
              esc(provider.age) +
              "<br>"
            : ""
          }

          <span class="gold">
            ● LIVE
          </span>

        `);

        bounds.push([
          provider.lat,
          provider.lng
        ]);
      }
    );

    if(bounds.length){

      liveMap.fitBounds(
        bounds,
        {
          padding:[30,30],
          maxZoom:15
        }
      );
    }

    const count =
      $("locationCount");

    if(count){

      count.textContent =
        locations.length +
        " interested provider" +
        (
          locations.length === 1
          ? ""
          : "s"
        ) +
        " currently sharing live location.";
    }

  }catch(error){

    console.error(
      "LIVE LOCATION ERROR",
      error
    );
  }
}


// ======================================
// GPS
// ======================================

function getCurrentPosition(){

  return new Promise(
    (resolve,reject) => {

      if(
        !navigator.geolocation
      ){

        reject(
          new Error(
            "GPS is not supported on this device."
          )
        );

        return;
      }

      navigator.geolocation.getCurrentPosition(
        resolve,
        reject,
        {
          enableHighAccuracy:true,
          timeout:10000,
          maximumAge:5000
        }
      );
    }
  );
}

function startLocationSharing(){

  if(
    locationWatchId !== null
  ){

    return;
  }

  if(
    !navigator.geolocation
  ){

    toast(
      "GPS is not available on this device."
    );

    return;
  }

  locationSharing =
    true;

  locationWatchId =
    navigator.geolocation.watchPosition(

      async position => {

        try{

          await api(
            "/location",
            {
              method:"PUT",
              body:{
                latitude:
                  position.coords.latitude,

                longitude:
                  position.coords.longitude
              }
            }
          );

        }catch(error){

          console.error(
            "GPS UPDATE ERROR",
            error
          );
        }
      },

      error => {

        console.error(
          "GPS ERROR",
          error
        );

        locationSharing =
          false;

        locationWatchId =
          null;

        toast(
          "Location sharing could not be started."
        );
      },

      {
        enableHighAccuracy:true,
        maximumAge:3000,
        timeout:10000
      }
    );
}

async function stopLocationWatch(){

  if(
    locationWatchId !== null
  ){

    navigator.geolocation.clearWatch(
      locationWatchId
    );

    locationWatchId =
      null;
  }

  if(!locationSharing){

    return;
  }

  locationSharing =
    false;

  try{

    await api(
      "/location/stop",
      {
        method:"PUT"
      }
    );

    toast(
      "Location sharing stopped."
    );

  }catch(error){

    console.error(error);
  }
}

// CHAT LIST
// ======================================

              : c.client_phone;

              <div class="card">

// ======================================
// OPEN CHAT
// ======================================

async function openChat(
  requestId
){

  try{

    const data =
      await api(
        `/chats/${requestId}/messages`
      );

    messages =
      data.messages || [];

    selectedRequestId =
      requestId;

    currentScreen =
      "chat";

    render();

  }catch(error){

    toast(error.message);
  }
}

function chatScreen(){

  return `

    <div class="card">

      <div class="row">

        <div class="grow">

          <h2 style="margin:0">
            Private Chat
          </h2>

          <div class="muted small">
            Request #${esc(selectedRequestId)}
          </div>

        </div>

        <button
          class="btn secondary small-btn"
          onclick="go('requests')"
        >
          BACK
        </button>

      </div>

      <div
        id="chatBox"
        style="
          height:400px;
          overflow-y:auto;
          margin-top:13px;
          padding:4px;
        "
      >

        ${
          messages.length
          ? messages.map(
              m => `

                <div
                  class="msg ${
                    m.sender_id === currentUser.id
                    ? "mine"
                    : ""
                  }"
                >

                  <strong>
                    ${esc(m.sender_name || "")}
                  </strong>

                  <br>

                  ${esc(m.body)}

                  <div
                    class="muted"
                    style="font-size:9px;margin-top:4px"
                  >
                    ${new Date(
                      m.created_at
                    ).toLocaleString()}
                  </div>

                </div>
              `
            ).join("")
          : `
            <div class="empty">
              Start the private conversation.
            </div>
          `
        }

      </div>

      <div
        class="row"
        style="margin-top:10px"
      >

        <input
          id="chatInput"
          placeholder="Write a private message..."
          onkeydown="
            if(event.key==='Enter')
              sendMessage()
          "
        >

        <button
          class="btn"
          style="width:100px"
          onclick="sendMessage()"
        >
          SEND
        </button>

      </div>

    </div>
  `;
}

async function sendMessage(){

  try{

    const input =
      $("chatInput");

    const body =
      input.value.trim();

    if(!body){
      return;
    }

    await api(
      `/chats/${selectedRequestId}/messages`,
      {
        method:"POST",
        body:{
          body
        }
      }
    );

    openChat(
      selectedRequestId
    );

  }catch(error){

    toast(error.message);
  }
}


// ======================================
// PROFILE
// ======================================

function profileScreen(){

  return `

    <div class="card">

      <div class="row">

        <div class="grow">

          <h2 style="margin:0">
            ${esc(currentUser.name)}
          </h2>

          <div class="muted">
            ${esc(currentUser.role)}
          </div>

          <div class="phone">
            ☎ ${esc(currentUser.phone)}
          </div>

        </div>

        <span class="pill">
          #TlaKwana
        </span>

      </div>

      <label>
        Age
      </label>

      <input

        type="number"

        max="100"

      </button>

      ? `

        <div class="card">

          <div class="toggle">

              <strong>
                Provider Availability
              </strong>

              <div class="muted small">

                ${
                  currentUser.available
                  ? "You are AVAILABLE."
                  : "You are NOT AVAILABLE."
                }

              </div>

            </div>

            <button
              class="switch ${
                currentUser.available
                ? "on"
                : ""
              }"
              onclick="toggleAvailability()"
            >
              <i></i>
            </button>

          </div>

          <div class="line"></div>

          <label>
            Provider photos — up to 3
          </label>

          <input
            id="profile-photos"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            multiple
          >

          <br>

          <button
            class="btn secondary"
            onclick="uploadPhotos()"
          >
            UPLOAD PHOTOS
          </button>

          ${
            currentUser.photos?.length
            ? `
              <div class="photos">

                ${
                  currentUser.photos
                    .slice(0,3)
                    .map(
                      p => `
                        <img
                          src="${esc(p)}"
                          alt="Profile photo"
                        >
                      `
                    )
                    .join("")
                }

              </div>
            `
            : ""
          }

        </div>

      `
      : ""
    }

    <div class="card">

      <button
        class="btn secondary"
        onclick="go('chatlist')"
      >
        PRIVATE CHATS
      </button>

      <br><br>

      ${
        locationSharing
        ? `
          <button
            class="btn danger"
            onclick="stopLocationWatch()"
          >
            STOP LOCATION SHARING
          </button>

          <br><br>
        `
        : ""
      }

      <button
        class="btn secondary"
        onclick="logout()"
      >
        LOG OUT
      </button>

    </div>
  `;
}

async function saveProfile(){

  try{

    const age =
      $("profile-age")
        .value;

    const data =
      await api(
        "/profile",
        {
          method:"PUT",
          body:{
            age
          }
        }
      );

    currentUser =
      data.user;

    toast(
      "Profile saved."
    );

    render();

  }catch(error){

    toast(error.message);
  }
}


// ======================================
// PHOTO UPLOAD
// ======================================

async function uploadPhotos(){

  try{

    const files =
      [
        ...$("profile-photos").files
      ].slice(0,3);

    if(!files.length){

      throw new Error(
        "Choose up to 3 photos first."
      );
    }

    const form =
      new FormData();

    files.forEach(
      file =>
        form.append(
          "photos",
          file
        )
    );

    const response =
      await fetch(
        API + "/profile/photos",
        {
          method:"POST",
          headers:{
            Authorization:
              "Bearer " + token
          },
          body:form
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Photo upload failed."
      );
    }

    currentUser =
      data.user;

    toast(
      "Photos updated."
    );

    render();

  }catch(error){

    toast(error.message);
  }
}

// START
// ======================================

boot();

</script>
